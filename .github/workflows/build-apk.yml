name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: Build Web App
        run: |
          npm run build

      - name: Add Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
          npx cap init "NOVA Player" "com.sourav.novaplayer" --web-dir dist
          npx cap add android
          
          # Inject Android 14/15/16 Notification & Audio permissions into AndroidManifest.xml
          node -e '
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          if (fs.existsSync(manifestPath)) {
            let xml = fs.readFileSync(manifestPath, "utf8");
            const permissions = `
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
`;
            if (!xml.includes("POST_NOTIFICATIONS")) {
              xml = xml.replace("<application", permissions + "\n    <application");
              xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
              fs.writeFileSync(manifestPath, xml, "utf8");
              console.log("Injected Android 14/15/16 permissions successfully");
            }
          }
          '
          
          # Fix Kotlin Duplicate Class Conflict in Android Gradle
          echo "
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
              }
          }
          " >> android/app/build.gradle

          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Player-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
