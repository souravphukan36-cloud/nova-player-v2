<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1829"/>
      <stop offset="100%" stop-color="#08070D"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E92FF"/>
      <stop offset="50%" stop-color="#7C6EFF"/>
      <stop offset="100%" stop-color="#5544E8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6EC7"/>
      <stop offset="100%" stop-color="#7C6EFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#purpleGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Glow effect -->
  <circle cx="256" cy="256" r="140" fill="#7C6EFF" opacity="0.25" filter="url(#glow)"/>

  <!-- Outer Soundwaves -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#7C6EFF" stroke-width="4" stroke-dasharray="12 16" opacity="0.3"/>
  <circle cx="256" cy="256" r="135" fill="none" stroke="#9E92FF" stroke-width="6" stroke-dasharray="24 16" opacity="0.5"/>

  <!-- Disc circle -->
  <circle cx="256" cy="256" r="100" fill="#12101D" stroke="url(#purpleGrad)" stroke-width="8"/>
  <circle cx="256" cy="256" r="60" fill="#191629" stroke="#7C6EFF" stroke-width="4" opacity="0.8"/>

  <!-- Center Musical Note / Play symbol -->
  <g fill="url(#purpleGrad)" transform="translate(190, 170) scale(1.1)">
    <path d="M72 16 L120 4 L120 76 A28 28 0 1 1 96 52 L96 32 L72 38 L72 88 A28 28 0 1 1 48 64 L48 16 Z" />
    <circle cx="48" cy="92" r="18" fill="url(#accentGrad)"/>
    <circle cx="96" cy="80" r="18" fill="url(#accentGrad)"/>
  </g>
</svg>
