<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="natureBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06281E"/>
      <stop offset="50%" stop-color="#021C14"/>
      <stop offset="100%" stop-color="#010E0A"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="natureGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="136" fill="url(#natureBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="132" fill="none" stroke="url(#emeraldGrad)" stroke-width="5" opacity="0.4"/>

  <!-- Nature Glow effect -->
  <circle cx="256" cy="256" r="140" fill="#10B981" opacity="0.25" filter="url(#natureGlow)"/>

  <!-- Acoustic Nature Resonance Rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#34D399" stroke-width="4" stroke-dasharray="14 18" opacity="0.35"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#FDE047" stroke-width="5" stroke-dasharray="20 16" opacity="0.5"/>

  <!-- Center Nature Sprouting Leaf & Acoustic Core -->
  <g transform="translate(136, 126) scale(10)">
    <!-- Leaf Body -->
    <path
      d="M12 2C7.5 4 4 8.5 4 13.5C4 18 7.5 21.5 12 22C16.5 21.5 20 18 20 13.5C20 8.5 16.5 4 12 2Z"
      fill="url(#emeraldGrad)"
      fill-opacity="0.3"
      stroke="url(#emeraldGrad)"
      stroke-width="1.2"
    />
    <!-- Leaf Stem & Sound Resonance -->
    <path
      d="M12 22V5M12 12C14.5 10 17 11.5 18 13M12 16C9.5 14.5 7 15.5 6 17"
      stroke="url(#emeraldGrad)"
      stroke-width="1.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Harmonic Golden Node -->
    <circle cx="12" cy="12" r="2.2" fill="url(#goldGrad)"/>
    <circle cx="12" cy="12" r="4.5" stroke="#FDE047" stroke-width="0.7" stroke-dasharray="1.5 2" opacity="0.85"/>
  </g>
</svg>
